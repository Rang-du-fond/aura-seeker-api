# Validate, test and build/push the Docker image of a Rust Axum server.
# Tip: pin third-party actions to a full commit SHA (Renovate/Dependabot keep them up to date).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 1. Fast static checks: format, lints, docs
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # 2. Tests with nextest (+ doctests, which nextest does not run)
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Tests + coverage
        run: cargo llvm-cov nextest --workspace --all-features --locked --lcov --output-path lcov.info
      - name: Doctests
        run: cargo test --doc --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  # 3. Docker: build, smoke test, scan; push + sign only on main/tags
  docker:
    needs: [check, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (local, for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ci-local:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (/health must answer)
        run: |
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/auth_signing_key.pem"
          chmod 644 "$RUNNER_TEMP/auth_signing_key.pem"
          docker run -d --name app -p 8080:8080 \
            -e AUTH_CODE_PEPPER="$(openssl rand -base64 32)" \
            -v "$RUNNER_TEMP/auth_signing_key.pem:/home/nonroot/auth_signing_key.pem:ro" \
            ci-local:test
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs app; exit 1

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@master   # pin to a release/SHA
        with:
          image-ref: ci-local:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (reuses the cache, adds SBOM + provenance)
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64        # add linux/arm64 if needed (or build it on ubuntu-24.04-arm)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, OIDC)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

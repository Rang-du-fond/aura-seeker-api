[workspace]
members = ["crates/*"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
option_if_let_else = "allow"

allow_attributes = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
exit = "deny"
expect_used = "deny"
float_cmp_const = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
str_to_string = "deny"
string_slice = "deny"
todo = "deny"
try_err = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[package]
name = "aura-api"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
authn = { path = "crates/authn" }
notifier = { path = "crates/notifier" }
telemetry = { path = "crates/telemetry" }
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
object_store = { version = "0.14", default-features = false, features = ["fs"] }
sea-orm = { version = "2", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
url = "2"
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
utoipa-axum = "0.3.0"
uuid = { version = "1", features = ["v7", "serde"] }
validator = { version = "0.21", features = ["derive"] }
include_dir = "0.7.4"
